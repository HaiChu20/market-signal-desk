[project]
name = "market-signal-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
]

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msd"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: real local-data integration test"]

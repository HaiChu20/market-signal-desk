services:
  market-signal-desk:
    build: .
    env_file: .env
    volumes:
      - ./data/live:/app/data/live
      - ./live.toml:/app/live.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time,sys; p=Path('/app/data/live/heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime < 180 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 2m
